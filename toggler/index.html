<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toggler</title>
<style>
  /* Transparent background so it blends into the Homepage card it's embedded in. */
  :root { --fg: #e5e7eb; --muted: #9ca3af; --on: #22c55e; --busy: #f59e0b; --off: #6b7280; --err: #ef4444; --track: #374151; }
  @media (prefers-color-scheme: light) {
    :root { --fg: #111827; --muted: #6b7280; --track: #d1d5db; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  ul { list-style: none; margin: 0; padding: 4px 8px; }
  li { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
  .running .dot { background: var(--on); }
  .starting .dot, .stopping .dot { background: var(--busy); }
  .unknown .dot { background: var(--err); }
  .name { flex: 1; text-transform: capitalize; }
  .state { color: var(--muted); font-size: 12px; min-width: 60px; text-align: right; }
  .unknown .state { color: var(--err); }
  /* switch */
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--track); border-radius: 999px; cursor: pointer; transition: background .15s; }
  .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .15s; }
  input:checked + .slider { background: var(--on); }
  input:checked + .slider::before { transform: translateX(16px); }
  input:disabled + .slider { opacity: .5; cursor: progress; }
  input:focus-visible + .slider { outline: 2px solid var(--fg); outline-offset: 2px; }
  #error { color: var(--err); font-size: 12px; padding: 0 8px; }
</style>
</head>
<body>
<ul id="apps"></ul>
<div id="error" role="alert"></div>
<script>
  const list = document.getElementById("apps");
  const errorBox = document.getElementById("error");
  const pending = new Set();

  function render(apps) {
    list.replaceChildren(...apps.map((app) => {
      const li = document.createElement("li");
      li.className = app.state;
      li.title = app.error || `${app.ready}/${app.desired} ready`;

      const dot = document.createElement("span");
      dot.className = "dot";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = app.name;
      const state = document.createElement("span");
      state.className = "state";
      state.textContent = app.state;

      const label = document.createElement("label");
      label.className = "switch";
      const input = document.createElement("input");
      input.type = "checkbox";
      input.setAttribute("aria-label", `Toggle ${app.name}`);
      input.checked = app.desired > 0;
      input.disabled = pending.has(app.name) || app.state === "unknown";
      input.addEventListener("change", () => toggle(app.name, input.checked));
      const slider = document.createElement("span");
      slider.className = "slider";
      label.append(input, slider);

      li.append(dot, name, state, label);
      return li;
    }));
  }

  async function refresh() {
    try {
      const res = await fetch("api/apps");
      if (!res.ok) throw new Error(`status ${res.status}`);
      render(await res.json());
      errorBox.textContent = "";
    } catch (err) {
      errorBox.textContent = `Can't reach toggler: ${err.message}`;
    }
  }

  async function toggle(name, on) {
    pending.add(name);
    errorBox.textContent = "";
    try {
      const res = await fetch(`api/apps/${encodeURIComponent(name)}/${on ? "start" : "stop"}`, {
        method: "POST",
        headers: { "X-Toggler": "1" },
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `status ${res.status}`);
      }
    } catch (err) {
      errorBox.textContent = `${name}: ${err.message}`;
    } finally {
      pending.delete(name);
      refresh();
    }
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
