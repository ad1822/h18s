apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: default
  labels:
    app: homepage
spec:
  selector:
    matchLabels:
      app: homepage
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: homepage
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - containerPort: 3000
              name: homepage
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: wallpaper
              mountPath: /app/public/images
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: h18s
      volumes:
        - name: config
          hostPath:
            path: /home/ad/homelab/config/homepage
        - name: wallpaper
          hostPath:
            path: /home/ad/Pictures/Wallpaper
      restartPolicy: Always
---
