apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clusterrole-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5" # secrets before the apps that use them
spec:
  project: apps
  source:
    repoURL: https://github.com/ad1822/h18s.git
    targetRevision: dev
    path: infra/clusterRole
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
