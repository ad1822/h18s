apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: h18s
  namespace: kube-system # default to this, because of TLSStore
spec:
  secretName: h18s-homepage-tls
  duration: 2160h # 90 days
  renewBefore: 360h # renew 15 days before expiry
  dnsNames:
    - h18s
    - homepage.h18s.lab
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: h18s-ca-issuer
    kind: ClusterIssuer
