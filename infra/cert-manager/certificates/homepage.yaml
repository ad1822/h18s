apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: h18s
  namespace: default
spec:
  secretName: h18s-tls
  duration: 2160h # 90 days
  renewBefore: 360h # renew 15 days before expiry
  dnsNames:
    - h18s
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: h18s-ca-issuer
    kind: ClusterIssuer
