on:
  pull_request:
  push:
    branches:
      - "**"
    paths:
      - "apps/**"
      - "argocd/**"
      - "infra/**"
      - ".github/workflows/**"
jobs:
  validate:
    runs-on: h18s
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v3
      - uses: bmuschko/setup-kubeconform@v1

      - name: Validate every kustomization
        shell: bash
        run: |
          failed=0
          for dir in $(find . -name kustomization.yaml -exec dirname {} \; | sort); do
            echo "::group::$dir"
            kustomize build "$dir" | kubeconform -strict -summary -skip CustomResourceDefinition \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              || { echo "::error::$dir failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
