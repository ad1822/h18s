on:
  pull_request:
  push:
    branches:
      - "**"
    paths:
      - "apps/**"
      - "argocd/**"
      - "infra/**"
      - ".github/workflows/**"

jobs:
  validate-kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup kubeconform
        uses: bmuschko/setup-kubeconform@v1

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Find all kubernetes dir
        id: kustomize-dirs
        run: |
          {
            echo 'dirs<<EOF'
            find . -name kustomization.yaml
            echo 'EOF',
          }

      - name: Echoing the directories
        run: echo "${{ steps.kustomize-dirs.outputs.dirs }}"
