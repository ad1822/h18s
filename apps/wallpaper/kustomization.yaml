apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - cronjob.yaml

configMapGenerator:
  - name: wallpaper-bg
    files:
      - script.sh

labels:
  - pairs:
      type: homepage
    includeTemplates: false # Also apply labels in Pod
    includeSelectors: false # Don't apply labels in matchSelectors
