apiVersion: apps/v1
kind: Deployment
metadata:
  name: toggler
  namespace: default
  labels:
    app: toggler
spec:
  replicas: 1 # always on, like homepage
  selector:
    matchLabels:
      app: toggler
  template:
    metadata:
      labels:
        app: toggler
    spec:
      serviceAccountName: toggler # its token is mounted automatically; kube.go reads it
      containers:
        - name: toggler
          image: ayushdumasia/h18s-toggler:0.1.0
          env:
            - name: APPS
              value: jellyfin,prowlarr,qbittorrent,radarr,seerr,sonarr
            - name: NAMESPACE
              value: default
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
