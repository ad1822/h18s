apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../_base

# no components: the official jellyfin image ignores PUID/PGID, and it only needs data/media

images:
  - name: app-image
    newName: jellyfin/jellyfin

labels:
  - pairs:
      app: jellyfin
    includeSelectors: true # also Deployment selector, pod labels, Service selector
  - pairs:
      type: media
      tier: user-facing
    includeTemplates: false
    includeSelectors: false

patches:
  # rename Deployment, Service and Ingress from "app" to "jellyfin"
  - target:
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: jellyfin
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8096
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
              - name: app
                volumeMounts:
                  - name: media # only the finished media, read by the library scanner
                    mountPath: /media
            volumes:
              - name: config # matched by name, not position
                hostPath:
                  path: /home/ad/homelab/config/jellyfin
              - name: media
                hostPath:
                  path: /home/ad/homelab/data/media
                  type: Directory
  - target:
      kind: Service
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8096
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: jellyfin.h18s.lab
