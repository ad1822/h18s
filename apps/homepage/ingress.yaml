apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: h18s
      http:
        paths:
          - {
              path: /,
              pathType: Prefix,
              backend: { service: { name: homepage, port: { number: 3000 } } },
            }
