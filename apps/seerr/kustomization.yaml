apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../_base


images:
  - name: app-image
    newName: ghcr.io/seerr-team/seerr
    newTag: latest

labels:
  - pairs:
      app: seerr
    includeSelectors: true # also Deployment selector, pod labels, Service selector
  - pairs:
      type: media
    includeTemplates: false
    includeSelectors: false

patches:
  - target:
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: seerr
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 5055
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /home/ad/homelab/config/seerr
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts/0/mountPath
        value: /app/config
  - target:
      kind: Service
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 5055
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: seerr.h18s.lab
