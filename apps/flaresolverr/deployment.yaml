apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  labels:
    app: flaresolverr
spec:
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Kolkata
            - name: LOG_LEVEL
              value: info
          ports:
            - containerPort: 8191
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 768Mi # headless Chromium; only runs while toggled on
      restartPolicy: Always
